version: "3.8"

services:
  nextjs-dev:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./generated:/app
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev"
    environment:
      - NODE_ENV=development

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: nextjsgen
      POSTGRES_PASSWORD: nextjsgen
      POSTGRES_DB: nextjsgen
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: 