version: '3.4'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: docgen
      POSTGRES_PASSWORD: docgen
      POSTGRES_DB: docgen
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docgen"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: 